name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Skill structure check
        run: python tools/check_skill.py
      - name: Unit tests
        run: python -m unittest discover -s tests
